name: Monitoreo Convocatorias Corfo

on:
  schedule:
    # Todos los días a las 10:00 UTC (07:00 AM hora de Chile)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    name: Extraer y Sincronizar Convocatorias Corfo
    # Versión fija: ubuntu-latest pasa a Ubuntu 26 y podría romper la instalación de Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          

      - name: Instalar dependencias del scraper
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Ejecutar scraper de Corfo
        run: |
          python scripts/corfo_convocatorias.py --salida convocatorias

      - name: Validar archivo de salida generado
        run: |
          if [ ! -f "convocatorias.json" ]; then
            echo "::error::convocatorias.json no fue generado por scripts/corfo_convocatorias.py"
            exit 1
          fi
          ITEM_COUNT=$(jq '. | length' convocatorias.json)
          echo "Se extrajeron $ITEM_COUNT convocatorias oficiales."
          if [ "$ITEM_COUNT" -eq 0 ]; then
            echo "::error::El archivo convocatorias.json está vacío (0 registros)."
            exit 1
          fi

      - name: Despertar el servidor y esperar a Firestore
        # Cloud Run apaga la app cuando no hay visitas. Al encender, la conexión con Firestore
        # tarda unos segundos: se espera a que /api/health/admin responda "ok" antes de enviar datos.
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "::error::Secret APP_URL no configurado en GitHub Actions."
            exit 1
          fi
          BASE_URL=$(echo "${{ secrets.APP_URL }}" | sed 's:/*$::')
          for i in 1 2 3 4 5 6 7 8; do
            BODY=$(curl -s --max-time 30 "${BASE_URL}/api/health/admin" || true)
            echo "Intento $i: $BODY"
            if echo "$BODY" | grep -q '"firestoreAdmin":"ok"'; then
              echo "Servidor listo."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Firestore Admin no respondió 'ok' después de 2 minutos; se intentará igual."

      - name: Enviar convocatorias al endpoint de sincronización
        run: |
          if [ -z "${{ secrets.CONVOCATORIAS_IMPORT_TOKEN }}" ]; then
            echo "::error::Secret CONVOCATORIAS_IMPORT_TOKEN no configurado en GitHub Actions."
            exit 1
          fi
          BASE_URL=$(echo "${{ secrets.APP_URL }}" | sed 's:/*$::')
          ENDPOINT="${BASE_URL}/api/admin/convocatorias/import"
          echo "Enviando datos hacia: $ENDPOINT"

          # Hasta 4 intentos si el servidor responde 5xx (por ejemplo, recién encendido)
          for i in 1 2 3 4; do
            HTTP_RESPONSE=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST "$ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "x-import-token: ${{ secrets.CONVOCATORIAS_IMPORT_TOKEN }}" \
              --data-binary @convocatorias.json || true)
            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
            echo "Intento $i — código HTTP $HTTP_STATUS: $HTTP_BODY"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Sincronización completada con éxito."
              exit 0
            fi
            case "$HTTP_STATUS" in 5*|000*|"") sleep 20 ;; *) break ;; esac
          done
          echo "::error::Fallo en la sincronización. Código HTTP $HTTP_STATUS: $HTTP_BODY"
          exit 1

      # Los recordatorios de vencimiento se envían en su propio robot (recordatorios.yml, 9:00).
